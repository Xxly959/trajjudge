[project]
name = "trajjudge"
version = "0.1.0"
description = "Reliability and prompt-injection audit of LLM graders on agent trajectories"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.40",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
